
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Dash 🍭</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

:root {
  --pink: #ff69ad;
  --purple: #a879ff;
  --cream: #fff8f2;
  --ink: #542b6e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #ffe7f4;
  color: var(--ink);
  font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
button { font: inherit; cursor: pointer; }
.game-shell {
  width: min(100%, 1050px);
  border: 5px solid white;
  border-radius: 30px;
  overflow: hidden;
  background: #fff8fc;
  box-shadow: 0 18px 55px #c779b64a;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 22px;
  gap: 12px;
  flex-wrap: wrap;
  background: white;
}
.logo {
  font-size: clamp(23px, 4vw, 34px);
  font-weight: 700;
  color: #f35baf;
  letter-spacing: -1px;
  text-shadow: 2px 3px 0 #ffdaee;
}
.logo span { color: #9c6bff; }
.stats { display: flex; gap: 9px; flex-wrap: wrap; }
.stat {
  background: #fff0f8;
  padding: 8px 13px;
  border-radius: 15px;
  font-size: 14px;
  font-weight: 600;
}
.stat b { color: #ef4eaa; }
.icon-btn {
  background: #f5eaff;
  color: #7647bd;
  border: 0;
  border-radius: 13px;
  padding: 10px 13px;
  font-weight: 700;
}
.stage {
  position: relative;
  overflow: hidden;
  background: #fbdcf5;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 900 / 480;
  touch-action: manipulation;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: #fff0f8b8;
  backdrop-filter: blur(5px);
  text-align: center;
}
.overlay.hidden { display: none; }
.panel {
  width: min(100%, 400px);
  padding: 23px;
  background: #fffdfd;
  border: 4px solid white;
  border-radius: 28px;
  box-shadow: 0 10px 30px #a44d9d25;
}
.hero-candy { font-size: 54px; line-height: 1.3; }
.panel h1 {
  margin: 2px 0 8px;
  font-size: clamp(32px, 6vw, 45px);
  color: #f153a7;
  letter-spacing: -1px;
}
.panel p {
  margin: 8px 0 17px;
  line-height: 1.5;
  color: #88688e;
}
.primary {
  width: 100%;
  border: 0;
  border-radius: 17px;
  padding: 14px 18px;
  color: white;
  font-size: 19px;
  font-weight: 700;
  background: linear-gradient(110deg, #ff65b1, #a477ff);
  box-shadow: 0 5px 0 #d64c9c;
  transition: transform .15s;
}
.primary:hover { transform: translateY(-2px); }
.primary:active { transform: translateY(2px); box-shadow: none; }
.small-note { font-size: 12px; color: #a38bab; margin-top: 15px; }
.footer {
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.footer p { margin: 0; color: #997b9c; font-size: 13px; }
.controls { display: flex; gap: 8px; }
.control {
  border: 0;
  border-radius: 14px;
  padding: 11px 17px;
  background: #f2e4ff;
  color: #7445b1;
  font-weight: 700;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
.control:active { background: #e0c5ff; transform: scale(.96); }
.control.jump { background: #ffe0f0; color: #e34a99; }
@media (max-width: 520px) {
  body { padding: 6px; }
  .game-shell { border-width: 3px; border-radius: 20px; }
  .topbar { padding: 12px; }
  .stat { padding: 7px 9px; font-size: 12px; }
  .panel { padding: 15px; }
  .hero-candy { font-size: 39px; }
  .footer { padding: 12px; }
  .control { padding: 12px; flex: 1; }
}
</style>
</head>
<body>
<div class="game-shell">
  <header class="topbar">
    <div class="logo">🍭 Candy <span>Dash!</span></div>
    <div class="stats">
      <div class="stat">🍬 <b id="score">0</b></div>
      <div class="stat">🏆 <b id="best">0</b></div>
      <div class="stat">❤️ <b id="lives">3</b></div>
    </div>
    <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause game">Ⅱ</button>
  </header>

  <main class="stage">
    <canvas id="game" width="900" height="480"
      aria-label="Candy Dash game. Jump over obstacles and collect candy."></canvas>

    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="hero-candy">🍓 🍭 🍩</div>
        <h1 id="panelTitle">Candy Dash!</h1>
        <p id="panelText">Welcome to the sweetest race ever. Jump over jelly monsters, grab all the candy, and see how far you can go!</p>
        <button class="primary" id="startBtn">LET'S DASH! ✨</button>
        <div class="small-note" id="panelNote">SPACE / ↑ to jump · Double jump included!</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>🍬 Grab sweets. Dodge trouble. Keep running!</p>
    <div class="controls">
      <button class="control" id="slideBtn">↓ SLIDE</button>
      <button class="control jump" id="jumpBtn">↑ JUMP!</button>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const W = canvas.width, H = canvas.height;
  const ground = 390;

  let state = 'menu';
  let lastTime = 0;
  let elapsed = 0;
  let distance = 0;
  let score = 0;
  let lives = 3;
  let speed = 300;
  let spawnTimer = 1;
  let candyTimer = 0.4;
  let shake = 0;
  let soundOn = true;
  let audio = null;
  let invincible = 0;
  let shield = 0;
  let slowTime = 0;
  let obstacles = [];
  let candies = [];
  let particles = [];
  let clouds = [];
  let backgroundCandy = [];
  let best = 0;

  try {
    best = Number(localStorage.getItem('candyDashBest')) || 0;
  } catch (_) {}
  $('best').textContent = best;

  const player = {
    x: 125, y: ground - 48, w: 43, h: 48,
    vy: 0, jumps: 0, slide: 0, run: 0
  };

  function rand(a, b) { return a + Math.random() * (b - a); }

  for (let i = 0; i < 9; i++) {
    clouds.push({ x: rand(0, W), y: rand(30, 230), s: rand(.6, 1.5) });
  }
  for (let i = 0; i < 22; i++) {
    backgroundCandy.push({ x: rand(0, W), y: rand(25, 350),
      s: rand(5, 13), a: rand(0, 6.28) });
  }

  function sound(freq = 650, duration = .09, type = 'sine') {
    if (!soundOn) return;
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(.07, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + duration);
    } catch (_) {}
  }

  function burst(x, y, color, amount = 10) {
    for (let i = 0; i < amount; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(50, 220);
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: rand(.3, .75), max: .75, size: rand(3, 8), color
      });
    }
  }

  function reset() {
    elapsed = distance = score = 0;
    lives = 3;
    speed = 300;
    spawnTimer = .9;
    candyTimer = .3;
    shake = invincible = shield = slowTime = 0;
    obstacles = [];
    candies = [];
    particles = [];
    player.y = ground - player.h;
    player.vy = 0;
    player.jumps = 0;
    player.slide = 0;
    player.run = 0;
    updateHUD();
  }

  function updateHUD() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('lives').textContent = '❤️'.repeat(lives) || '0';
  }

  function showPanel(title, message, button, note) {
    $('panelTitle').textContent = title;
    $('panelText').textContent = message;
    $('startBtn').textContent = button;
    $('panelNote').textContent = note;
    $('overlay').classList.remove('hidden');
  }

  function startGame() {
    reset();
    state = 'playing';
    $('overlay').classList.add('hidden');
    $('pauseBtn').textContent = 'Ⅱ';
    lastTime = performance.now();
    sound(550, .1);
  }

  function pauseGame() {
    if (state === 'playing') {
      state = 'paused';
      showPanel('Take a breather! 🍡', 'Your candy adventure is right where you left it.', 'KEEP GOING!', 'Press P or Escape to resume.');
      $('pauseBtn').textContent = '▶';
    } else if (state === 'paused') {
      state = 'playing';
      $('overlay').classList.add('hidden');
      $('pauseBtn').textContent = 'Ⅱ';
      lastTime = performance.now();
    }
  }

  function gameOver() {
    state = 'over';
    sound(180, .25, 'triangle');
    if (score > best) {
      best = score;
      try { localStorage.setItem('candyDashBest', String(best)); } catch (_) {}
    }
    updateHUD();
    showPanel('Sugar rush over! 🍭',
      `You collected ${score} candies! ${score >= best ? 'That was your best run!' : 'Ready for another round?'}`,
      'PLAY AGAIN ↻', 'Space or Enter to jump back in.');
  }

  function jump() {
    if (state !== 'playing') {
      if (state === 'menu' || state === 'over') startGame();
      else if (state === 'paused') pauseGame();
      return;
    }
    if (player.jumps < 2) {
      player.vy = player.jumps === 0 ? -640 : -560;
      player.jumps++;
      player.slide = 0;
      burst(player.x + player.w / 2, player.y + player.h, '#fff0b5', 5);
      sound(player.jumps === 1 ? 420 : 600, .09);
    }
  }

  function slideStart() {
    if (state === 'playing') player.slide = .48;
  }

  $('startBtn').addEventListener('click', () => {
    if (state === 'paused') pauseGame();
    else startGame();
  });
  $('pauseBtn').addEventListener('click', pauseGame);
  $('soundBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) sound(600, .08);
  });
  $('jumpBtn').addEventListener('pointerdown', e => {
    e.preventDefault();
    jump();
  });
  $('slideBtn').addEventListener('pointerdown', e => {
    e.preventDefault();
    slideStart();
  });
  canvas.addEventListener('pointerdown', () => {
    if (state === 'playing') jump();
  });

  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if ([' ', 'arrowup', 'arrowdown'].includes(key)) e.preventDefault();
    if (e.repeat && [' ', 'arrowup', 'w'].includes(key)) return;
    if (key === ' ' || key === 'arrowup' || key === 'w') jump();
    if (key === 'arrowdown' || key === 's') slideStart();
    if (key === 'p' || key === 'escape') {
      if (state === 'playing' || state === 'paused') pauseGame();
    }
    if (key === 'enter' && (state === 'menu' || state === 'over')) startGame();
  });

  function addObstacle() {
    const r = Math.random();
    if (r < .55) {
      obstacles.push({
        type: 'blob', x: W + 30, y: ground - 38,
        w: 37, h: 38, color: ['#ff75a9','#a47aff','#63d9bd'][Math.floor(rand(0,3))],
        passed: false
      });
    } else if (r < .79) {
      obstacles.push({
        type: 'cake', x: W + 30, y: ground - 47,
        w: 43, h: 47, color: '#ffb4c9', passed: false
      });
    } else {
      obstacles.push({
        type: 'lollipop', x: W + 30, y: ground - 100,
        w: 35, h: 100, passed: false
      });
    }
  }

  function addCandy() {
    const y = rand(ground - 155, ground - 55);
    const type = Math.random() < .09 ? 'shield' :
                 Math.random() < .10 ? 'star' : 'candy';
    candies.push({
      x: W + 20, y, r: type === 'star' ? 15 : 12,
      type, spin: 0
    });
  }

  function collides(a, b) {
    return a.x + a.w * .72 > b.x + 5 &&
           a.x + a.w * .25 < b.x + b.w - 5 &&
           a.y + a.h * .85 > b.y + 4 &&
           a.y + a.h * .15 < b.y + b.h - 2;
  }

  function update(dt) {
    elapsed += dt;
    distance += speed * dt / 10;
    speed = Math.min(610, 300 + elapsed * 5);
    const worldSpeed = speed * (slowTime > 0 ? .52 : 1);

    if (invincible > 0) invincible -= dt;
    if (shield > 0) shield -= dt;
    if (slowTime > 0) slowTime -= dt;
    if (shake > 0) shake -= dt;

    player.run += dt * speed / 50;
    player.vy += 1550 * dt;
    player.y += player.vy * dt;

    if (player.y + player.h >= ground) {
      player.y = ground - player.h;
      player.vy = 0;
      player.jumps = 0;
    }
    if (player.slide > 0) player.slide -= dt;

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      addObstacle();
      spawnTimer = rand(.85, 1.5) * Math.max(.62, 300 / speed);
    }
    candyTimer -= dt;
    if (candyTimer <= 0) {
      addCandy();
      candyTimer = rand(.45, .8);
    }

    for (const o of obstacles) o.x -= worldSpeed * dt;
    obstacles = obstacles.filter(o => o.x + o.w > -20);

    for (const c of candies) {
      c.x -= worldSpeed * dt;
      c.spin += dt * 4;
      const p = {
        x: player.x + 8, y: player.y + 5,
        w: player.w - 16, h: player.h - 8
      };
      if (Math.abs(c.x - (p.x + p.w / 2)) < c.r + p.w / 2 &&
          Math.abs(c.y - (p.y + p.h / 2)) < c.r + p.h / 2) {
        if (c.type === 'shield') {
          shield = 7;
          burst(c.x, c.y, '#7fe8ed', 15);
          sound(740, .14);
        } else if (c.type === 'star') {
          score += 5;
          slowTime = 3;
          burst(c.x, c.y, '#ffe16e', 16);
          sound(880, .15);
        } else {
          score++;
          burst(c.x, c.y, '#ff79c3', 7);
          sound(650 + Math.random() * 250, .06);
        }
        c.x = -100;
        updateHUD();
      }
    }
    candies = candies.filter(c => c.x > -30);

    for (const o of obstacles) {
      const ph = player.slide > 0 ? 25 : player.h;
      const py = player.slide > 0 ? ground - ph : player.y;
      const p = { x: player.x, y: py, w: player.w, h: ph };
      if (!o.passed && collides(p, o)) {
        o.passed = true;
        if (shield > 0) {
          shield = 0;
          burst(o.x + o.w / 2, o.y + o.h / 2, '#8eeef0', 20);
          sound(780, .14);
        } else if (invincible <= 0) {
          lives--;
          invincible = 1.25;
          shake = .22;
          burst(player.x + 20, player.y + 20, '#ff729f', 15);
          sound(160, .16, 'sawtooth');
          updateHUD();
          if (lives <= 0) gameOver();
        }
      }
    }

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 350 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    for (const c of clouds) {
      c.x -= worldSpeed * dt * .11;
      if (c.x < -100) {
        c.x = W + 50;
        c.y = rand(30, 230);
      }
    }
    for (const c of backgroundCandy) {
      c.x -= worldSpeed * dt * .16;
      c.a += dt;
      if (c.x < -20) c.x = W + 20;
    }
  }

  function roundedRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = '#ffffffa8';
    ctx.beginPath();
    ctx.arc(x, y, 20*s, 0, Math.PI*2);
    ctx.arc(x+22*s, y-11*s, 25*s, 0, Math.PI*2);
    ctx.arc(x+47*s, y, 19*s, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCandy(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(c.spin) * .22);
    if (c.type === 'shield') {
      ctx.fillStyle = '#7be4ed';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = '19px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♥', 0, 1);
    } else if (c.type === 'star') {
      ctx.fillStyle = '#ffe16e';
      ctx.strokeStyle = '#f6a83b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5 - Math.PI/2;
        const r = i % 2 ? 7 : 15;
        if (i === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ff78bd';
      ctx.beginPath();
      ctx.moveTo(-18, -3); ctx.lineTo(-9, -9);
      ctx.lineTo(-9, 9); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(18, -3); ctx.lineTo(9, -9);
      ctx.lineTo(9, 9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffabd3';
      ctx.strokeStyle = '#ee579d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#fff0fa';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-4, -7); ctx.lineTo(4, 7);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    const sliding = player.slide > 0;
    const x = player.x, y = sliding ? ground - 27 : player.y;
    if (invincible > 0 && Math.floor(elapsed * 13) % 2 === 0) return;

    ctx.save();
    ctx.translate(x + player.w/2, y + (sliding ? 15 : 0));
    if (shield > 0) {
      ctx.strokeStyle = '#70e7ed';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(0, sliding ? 1 : 24, 31, sliding ? 18 : 37, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    if (sliding) ctx.rotate(-.12);
    const bob = !sliding && player.y + player.h >= ground ? Math.sin(player.run)*2 : 0;
    ctx.translate(0, bob);

    if (!sliding) {
      // Strawberry-shaped runner
      ctx.fillStyle = '#ef4c92';
      ctx.beginPath();
      ctx.moveTo(-19, 13); ctx.quadraticCurveTo(-25, -12, -13, -25);
      ctx.quadraticCurveTo(0, -35, 13, -25);
      ctx.quadraticCurveTo(26, -12, 19, 13);
      ctx.quadraticCurveTo(0, 34, -19, 13);
      ctx.fill();
      ctx.fillStyle = '#8ddf8c';
      ctx.beginPath();
      ctx.moveTo(-12,-24); ctx.lineTo(-4,-34); ctx.lineTo(0,-24);
      ctx.lineTo(8,-34); ctx.lineTo(13,-22); ctx.lineTo(0,-18);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = '#ffeaa6';
      for (const [sx,sy] of [[-10,-12],[9,-14],[-14,2],[11,4],[0,13]]) {
        ctx.beginPath(); ctx.ellipse(sx,sy,2,3,.3,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#542b6e';
      ctx.beginPath(); ctx.arc(-7,-3,2.5,0,Math.PI*2); ctx.arc(7,-3,2.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#542b6e';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,1,5,.2,Math.PI-.2); ctx.stroke();

      ctx.strokeStyle = '#f35caa';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      const leg = Math.sin(player.run*2)*5;
      ctx.beginPath();
      ctx.moveTo(-7,25); ctx.lineTo(-9+leg,31);
      ctx.moveTo(7,25); ctx.lineTo(9-leg,31);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ef4c92';
      ctx.beginPath(); ctx.ellipse(0,0,26,12,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#8ddf8c';
      ctx.beginPath(); ctx.moveTo(-10,-8); ctx.lineTo(-6,-17); ctx.lineTo(1,-8);
      ctx.fill();
      ctx.fillStyle = '#542b6e';
      ctx.beginPath(); ctx.arc(-8,-1,2,0,Math.PI*2); ctx.arc(5,-1,2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();
    if (o.type === 'blob') {
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y+o.h);
      ctx.quadraticCurveTo(o.x-4,o.y+4,o.x+12,o.y+4);
      ctx.quadraticCurveTo(o.x+o.w/2,o.y-9,o.x+o.w-8,o.y+7);
      ctx.quadraticCurveTo(o.x+o.w+4,o.y+o.h,o.x,o.y+o.h);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.ellipse(o.x+12,o.y+17,6,8,0,0,Math.PI*2);
      ctx.ellipse(o.x+25,o.y+17,6,8,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#4f3266';
      ctx.beginPath();
      ctx.arc(o.x+13,o.y+19,2.5,0,Math.PI*2);
      ctx.arc(o.x+24,o.y+19,2.5,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#4f3266'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x+19,o.y+23,4,.2,Math.PI-.2); ctx.stroke();
    } else if (o.type === 'cake') {
      roundedRect(o.x,o.y+9,o.w,o.h-9,7,'#ef8db8');
      roundedRect(o.x-2,o.y+4,o.w+4,13,7,'#fff0f6');
      roundedRect(o.x+5,o.y+20,5,9,2,'#fff4b5');
      roundedRect(o.x+24,o.y+28,5,9,2,'#fff4b5');
      ctx.fillStyle = '#ff629e';
      ctx.beginPath(); ctx.arc(o.x+o.w/2,o.y+2,5,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#d89bff';
      ctx.fillRect(o.x+15,o.y+30,6,70);
      ctx.fillStyle = '#fff1a5';
      ctx.strokeStyle = '#ed78b6'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(o.x+18,o.y+22,17,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#f38bc6'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(o.x+7,o.y+9); ctx.lineTo(o.x+29,o.y+34);
      ctx.moveTo(o.x+7,o.y+34); ctx.lineTo(o.x+29,o.y+9);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#e5d8ff');
    sky.addColorStop(.65,'#ffcfe8');
    sky.addColorStop(1,'#ffb8d8');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);

    // Distant hills
    ctx.fillStyle = '#e6c6ff';
    ctx.beginPath(); ctx.moveTo(0,330);
    for (let x=0;x<=W;x+=10) ctx.lineTo(x,310+Math.sin(x*.012+elapsed*.2)*19);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();

    ctx.fillStyle = '#f4bde9';
    ctx.beginPath(); ctx.moveTo(0,355);
    for (let x=0;x<=W;x+=10) ctx.lineTo(x,340+Math.sin(x*.018+elapsed*.15)*14);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();

    for (const c of clouds) drawCloud(c.x,c.y,c.s);
    for (const c of backgroundCandy) {
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
      ctx.globalAlpha=.48; ctx.fillStyle='#fff7ff';
      ctx.beginPath(); ctx.arc(0,0,c.s,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // Candy-cane ground
    ctx.fillStyle = '#fff8fc';
    ctx.fillRect(0,ground,W,H-ground);
    const stripe = 34, offset = (distance*10) % stripe;
    for (let x=-stripe-offset;x<W+stripe;x+=stripe) {
      ctx.fillStyle = '#ffc5e0';
      ctx.beginPath();
      ctx.moveTo(x,ground); ctx.lineTo(x+16,ground);
      ctx.lineTo(x-14,H); ctx.lineTo(x-30,H); ctx.fill();
    }
    ctx.fillStyle = '#ff8bc8';
    ctx.fillRect(0,ground,W,5);

    ctx.save();
    if (shake > 0) ctx.translate(rand(-5,5),rand(-3,3));
    for (const c of candies) drawCandy(c);
    for (const o of obstacles) drawObstacle(o);
    drawPlayer();
    ctx.restore();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0,p.life/p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'playing') {
      ctx.fillStyle = '#8557a8';
      ctx.font = '600 16px Fredoka, sans-serif';
      ctx.fillText('SWEETNESS LEVEL ' + Math.floor(elapsed/10+1), 20, 30);
      if (slowTime > 0) ctx.fillText('✨ SUGAR MAGIC!', 20, 53);
      if (shield > 0) ctx.fillText('🫧 SHIELD!', 20, 76);
    }
  }

  function frame(now) {
    const dt = Math.min((now-lastTime)/1000 || 0, .033);
    lastTime = now;
    if (state === 'playing') update(dt);
    else if (state !== 'paused') {
      // Keep the candy world gently alive on the title screen.
      elapsed += dt * .3;
      for (const c of clouds) {
        c.x -= 8*dt;
        if (c.x < -100) c.x = W+50;
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  updateHUD();
  showPanel('Candy Dash!', 'Welcome to the sweetest race ever. Jump over jelly monsters, grab all the candy, and see how far you can go!', "LET'S DASH! ✨", 'SPACE / ↑ to jump · Double jump included!');
  requestAnimationFrame(now => {
    lastTime = now;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
